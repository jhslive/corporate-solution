<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사내 통합 솔루션</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <!-- 네비게이션 바 -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-xl font-bold text-blue-600">사내 통합 솔루션</h1>
            <nav class="flex space-x-4">
                <button onclick="switchTab('cpu')" id="btn-cpu" class="px-3 py-2 rounded-md font-medium text-blue-600 bg-blue-50">CPU 검색</button>
                <button onclick="switchTab('affiliate')" id="btn-affiliate" class="px-3 py-2 rounded-md font-medium text-gray-600 hover:bg-gray-100">가맹점 조회</button>
                <button onclick="switchTab('qna')" id="btn-qna" class="px-3 py-2 rounded-md font-medium text-gray-600 hover:bg-gray-100">질문하기</button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- 1. CPU 검색 탭 -->
        <section id="tab-cpu" class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-lg font-semibold mb-4">CPU 데이터베이스 검색</h2>
                <div class="relative max-w-xl">
                    <div class="flex gap-2">
                        <input type="text" id="cpu-input" placeholder="CPU 모델명을 입력하세요 (예: Apple M1, 라이젠 5 4500)" class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" autocomplete="off">
                        <button onclick="searchCpu()" class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">검색</button>
                    </div>
                    <!-- 자동완성 드롭다운 -->
                    <div id="cpu-suggestions" class="absolute left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg hidden z-10 max-h-60 overflow-y-auto"></div>
                </div>
                <div id="cpu-result" class="mt-4 p-4 bg-gray-50 rounded-lg hidden"></div>
            </div>
        </section>

        <!-- 2. 가맹점 조회 탭 -->
        <section id="tab-affiliate" class="space-y-6 hidden">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-lg font-semibold mb-4">카드사별 가맹점 번호 및 승인/해지 조회</h2>
                <div class="flex gap-2 max-w-xl mb-6">
                    <input type="text" id="biz-input" placeholder="사업자등록번호 입력" class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="searchAffiliate()" class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">조회</button>
                </div>
                <div id="affiliate-result" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            </div>
        </section>

        <!-- 3. 질문하기 탭 -->
        <section id="tab-qna" class="space-y-6 hidden">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold">사내 Q&A 게시판</h2>
                    <div id="admin-auth-area">
                        <button onclick="openLoginModal()" id="admin-toggle-btn" class="px-4 py-2 bg-gray-200 text-gray-700 text-sm rounded-lg hover:bg-gray-300">관리자 로그인</button>
                    </div>
                </div>

                <!-- 질문 작성 영역 -->
                <div class="mb-6 p-4 bg-gray-50 rounded-lg">
                    <textarea id="qna-content" rows="3" placeholder="질문 내용을 입력하세요 (즉시 공개됩니다)" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mb-2"></textarea>
                    <button onclick="submitQuestion()" class="px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700">질문 등록</button>
                </div>

                <!-- 질문 목록 -->
                <div id="qna-list" class="space-y-4"></div>
            </div>
        </section>
    </main>

    <!-- 관리자 로그인 모달 -->
    <div id="login-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-xl w-96 shadow-xl">
            <h3 class="text-lg font-bold mb-4">관리자 로그인</h3>
            <input type="email" id="admin-email" placeholder="관리자 이메일" class="w-full mb-3 px-3 py-2 border rounded-lg">
            <input type="password" id="admin-password" placeholder="비밀번호" class="w-full mb-4 px-3 py-2 border rounded-lg">
            <div class="flex justify-end gap-2">
                <button onclick="closeLoginModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg">취소</button>
                <button onclick="handleAdminLogin()" class="px-4 py-2 bg-blue-600 text-white rounded-lg">로그인</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK 및 앱 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 제공해주신 파이어베이스 설정값 적용
        const firebaseConfig = {
            apiKey: "AIzaSyBuyJ1zzYcaR-tVtSq-rxuNhF2bSbpsxcc",
            authDomain: "payhere-corporate-solution.firebaseapp.com",
            projectId: "payhere-corporate-solution",
            storageBucket: "payhere-corporate-solution.firebasestorage.app",
            messagingSenderId: "458890398032",
            appId: "1:458890398032:web:c5a321069a9efaa530c455",
            measurementId: "G-7CVZGSX4GT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isAdmin = false;

        // 세션 지속성 설정 (새로고침 시 로그아웃 방지)
        setPersistence(auth, browserLocalPersistence).catch((error) => {
            console.error("Persistence error:", error);
        });

        // 인증 상태 감지
        onAuthStateChanged(auth, (user) => {
            isAdmin = !!user;
            const authArea = document.getElementById("admin-auth-area");
            if (isAdmin) {
                authArea.innerHTML = `<span class="text-sm text-blue-600 font-semibold mr-2">관리자 모드 (ON)</span><button onclick="handleLogout()" class="px-3 py-1 bg-gray-200 text-gray-700 text-xs rounded hover:bg-gray-300">로그아웃</button>`;
            } else {
                authArea.innerHTML = `<button onclick="openLoginModal()" class="px-4 py-2 bg-gray-200 text-gray-700 text-sm rounded-lg hover:bg-gray-300">관리자 로그인</button>`;
            }
            loadQuestions(); // 질문 목록 렌더링 갱신
        });

        window.openLoginModal = () => document.getElementById('login-modal').classList.remove('hidden');
        window.closeLoginModal = () => document.getElementById('login-modal').classList.add('hidden');

        window.handleAdminLogin = async () => {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert("관리자 로그인 성공!");
                closeLoginModal();
            } catch (error) {
                alert("로그인 실패: " + error.message);
            }
        };

        window.handleLogout = async () => {
            await signOut(auth);
            alert("로그아웃 되었습니다.");
        };

        // CPU 데이터베이스 샘플
        const CPU_DATABASE = [
            { name: "Apple M1", score: 15000 },
            { name: "Apple M2", score: 18000 },
            { name: "AMD Ryzen 5 4500", score: 13000 },
            { name: "AMD Ryzen 5 4600", score: 13500 },
            { name: "Intel Core i5-13600K", score: 24000 }
        ];

        // 탭 전환 함수
        window.switchTab = (tabName) => {
            ['cpu', 'affiliate', 'qna'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).className = "px-3 py-2 rounded-md font-medium text-gray-600 hover:bg-gray-100";
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`btn-${tabName}`).className = "px-3 py-2 rounded-md font-medium text-blue-600 bg-blue-50";
        };

        // CPU 자동완성 및 검색 로직
        const cpuInput = document.getElementById('cpu-input');
        const cpuSuggestions = document.getElementById('cpu-suggestions');

        cpuInput.addEventListener('input', (e) => {
            const val = e.target.value.trim().toLowerCase();
            if (!val) {
                cpuSuggestions.classList.add('hidden');
                return;
            }
            const matches = CPU_DATABASE.filter(c => c.name.toLowerCase().includes(val));
            if (matches.length > 0) {
                cpuSuggestions.innerHTML = matches.map(m => `<div class="p-2 hover:bg-gray-100 cursor-pointer" onclick="selectCpu('${m.name}')">${m.name}</div>`).join('');
                cpuSuggestions.classList.remove('hidden');
            } else {
                cpuSuggestions.classList.add('hidden');
            }
        });

        window.selectCpu = (name) => {
            cpuInput.value = name;
            cpuSuggestions.classList.add('hidden');
            searchCpu();
        };

        window.searchCpu = () => {
            const queryName = cpuInput.value.trim().toLowerCase();
            const found = CPU_DATABASE.find(c => c.name.toLowerCase() === queryName);
            const resultDiv = document.getElementById('cpu-result');
            resultDiv.classList.remove('hidden');
            if (found) {
                resultDiv.innerHTML = `<p class="font-semibold text-blue-600">${found.name}</p><p class="text-sm text-gray-600">성능 점수: ${found.score}</p>`;
            } else {
                resultDiv.innerHTML = `<p class="text-red-500">일치하는 CPU가 없습니다. (목록에서 선택하거나 정확히 입력 후 엔터를 치세요)</p>`;
            }
        };

        // 가맹점 조회 로직 (카드사별 개별 가맹번호/날짜 표시)
        window.searchAffiliate = () => {
            const bizNo = document.getElementById('biz-input').value.trim();
            const resDiv = document.getElementById('affiliate-result');
            if (!bizNo) {
                alert("사업자등록번호를 입력해주세요.");
                return;
            }
            // 더미 9개 카드사 데이터 렌더링 예시
            const cardCompanies = ["신한카드", "삼성카드", "KB국민카드", "현대카드", "롯데카드", "우리카드", "하나카드", "BC카드", "NH농협카드"];
            resDiv.innerHTML = cardCompanies.map((card, idx) => `
                <div class="p-4 border rounded-lg bg-gray-50">
                    <h3 class="font-bold text-gray-800 mb-2">${card}</h3>
                    <div class="text-sm space-y-1 text-gray-600">
                        <p>가맹번호: 1234567${idx}</p>
                        <p class="text-green-600 font-medium">승인: 2024-01-15</p>
                        ${idx % 2 === 0 ? '<p class="text-red-500 font-medium">해지: 2025-06-30</p>' : '<p class="text-blue-500">상태: 정상 가맹 중</p>'}
                    </div>
                </div>
            `).join('');
        };

        // Q&A 질문 등록 (Firestore 연동)
        window.submitQuestion = async () => {
            const content = document.getElementById('qna-content').value.trim();
            if (!content) {
                alert("질문 내용을 입력해주세요.");
                return;
            }
            try {
                await addDoc(collection(db, "questions"), {
                    content,
                    answer: "",
                    transferType: "", // "cx" 또는 "other"
                    createdAt: serverTimestamp()
                });
                document.getElementById('qna-content').value = "";
            } catch (e) {
                alert("질문 등록 중 오류가 발생했습니다: " + e.message);
            }
        };

        // Q&A 목록 실시간 로드
        function loadQuestions() {
            const q = query(collection(db, "questions"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const listDiv = document.getElementById('qna-list');
                let html = "";
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    const isAnswered = !!data.answer;
                    const transferType = data.transferType || "";
                    
                    // 테두리 색상 결정 (이관 선택시 빨간색, 아니면 기본)
                    const borderColor = transferType ? "border-red-500 border-2" : "border-gray-200";
                    const statusBadge = isAnswered 
                        ? '<span class="px-2 py-1 bg-green-100 text-green-700 text-xs rounded-full font-semibold">답변완료</span>' 
                        : '<span class="px-2 py-1 bg-gray-100 text-gray-600 text-xs rounded-full font-semibold">답변대기</span>';

                    html += `
                        <div class="p-4 border rounded-xl bg-white shadow-sm ${borderColor} transition-all">
                            <div class="flex justify-between items-center mb-2">
                                ${statusBadge}
                                <span class="text-xs text-gray-400">${data.createdAt?.toDate ? new Date(data.createdAt.toDate()).toLocaleString() : '방금 전'}</span>
                            </div>
                            <p class="text-gray-800 mb-3 whitespace-pre-wrap">${data.content}</p>
                            
                            <!-- 답변 표시 영역 -->
                            ${isAnswered ? `<div class="p-3 bg-green-50 rounded-lg text-sm text-green-900 mb-3"><span class="font-bold">답변:</span> ${data.answer}</div>` : ''}

                            <!-- 관리자 전용 답변 및 이관 설정 영역 -->
                            ${isAdmin ? `
                                <div class="mt-3 pt-3 border-t border-gray-100 space-y-2">
                                    <div class="flex gap-2">
                                        <input type="text" id="ans-input-${id}" placeholder="답변을 입력하세요" value="${data.answer || ''}" class="flex-1 px-3 py-1 text-sm border rounded">
                                        <button onclick="saveAnswer('${id}')" class="px-3 py-1 bg-blue-600 text-white text-xs rounded hover:bg-blue-700">답변 등록</button>
                                    </div>
                                    <div class="flex gap-2 items-center text-xs">
                                        <span class="font-semibold text-gray-600">이관 분류:</span>
                                        <button onclick="setTransfer('${id}', 'cx')" class="px-2 py-1 rounded ${transferType === 'cx' ? 'bg-red-600 text-white' : 'bg-gray-100 text-gray-700'}">CX 이관</button>
                                        <button onclick="setTransfer('${id}', 'other')" class="px-2 py-1 rounded ${transferType === 'other' ? 'bg-red-600 text-white' : 'bg-gray-100 text-gray-700'}">타팀 이관</button>
                                        ${transferType ? `<button onclick="setTransfer('${id}', '')" class="text-gray-400 underline ml-2">이관 해제</button>` : ''}
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
                listDiv.innerHTML = html || '<p class="text-gray-500 text-center py-4">등록된 질문이 없습니다.</p>';
            });
        }

        window.saveAnswer = async (id) => {
            const answerText = document.getElementById(`ans-input-${id}`).value.trim();
            try {
                await updateDoc(doc(db, "questions", id), { answer: answerText });
                alert("답변이 저장되었습니다.");
            } catch (e) {
                alert("저장 실패: " + e.message);
            }
        };

        window.setTransfer = async (id, type) => {
            try {
                await updateDoc(doc(db, "questions", id), { transferType: type });
            } catch (e) {
                alert("이관 설정 실패: " + e.message);
            }
        };

        // 초기 로드 시 질문 목록 불러오기 시작
        loadQuestions();
    </script>
</body>
</html>
